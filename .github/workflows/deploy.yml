name: Deploy pagina estatica en pages

on:
  # cuando se hace push
  push:
    # rama main
    branches: ["main"]
  # ejecutar manualmente desde la ventana de github actions
  workflow_dispatch:

permissions:
  # permisos necesarios para que GitHubActions escriba en el despliegue en consola
  contents: read
  pages: write
  id-token: write

# solo permite un despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps: 
      # 1 Revision de codigo y lectura
      - name: Checkout
        uses: actions/checkout@v6

      # 2 Preparacion de github pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3 Carga de archivos a github pages
      - name: Carga artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # carpeta donde esta la web (index.html)
          path: "."
          
      # desplegar los archivos con github pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4